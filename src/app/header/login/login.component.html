<div class="min-h-screen flex items-center justify-center bg-black">
    <div class="w-full max-w-md bg-gray-900 p-8 rounded-lg shadow-lg">
  
      <h2 class="text-2xl font-bold text-gray-400 text-center mb-6">
        Login
      </h2>
  
      <!-- Error Message -->
      <div *ngIf="error" class="mb-4 p-3 bg-red-900 border border-red-600 rounded text-red-300 text-sm">
        {{ error }}
      </div>

      <!-- Email -->
      <form (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-gray-300 mb-1">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Enter email"
            required
            class="w-full px-4 py-2 rounded bg-black border border-gray-600 text-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
        </div>
    
        <!-- Password -->
        <div class="mb-6">
          <label class="block text-gray-300 mb-1">Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter password"
            required
            class="w-full px-4 py-2 rounded bg-black border border-gray-600 text-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
        </div>
    
        <!-- Button -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-2 bg-gray-600 text-black font-semibold rounded hover:bg-gray-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading">Logging in...</span>
        </button>
      </form>
  
      <!-- Extra -->
      <p class="text-center text-gray-400 mt-4 text-sm">
        Don't have an account?
        <a routerLink="/register" class="underline cursor-pointer hover:text-gray-300">
          Register
        </a>
      </p>
  
    </div>
  </div>
