<div class="min-h-screen bg-gray-50 py-12">
  <div class="container mx-auto px-6">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Artists</h1>
        <p class="text-gray-600">Meet our artists</p>
      </div>
      <button (click)="fetchArtists()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 text-sm">
        Refresh
      </button>
    </div>

    <div *ngIf="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
      <p class="text-gray-500 mt-4">Loading artists...</p>
    </div>

    <div *ngIf="!loading && error" class="bg-red-100 text-red-700 p-4 rounded mb-6">
      {{ error }}
    </div>

    <div *ngIf="!loading && (artists?.length || 0) > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <a *ngFor="let artist of artists"
         [routerLink]="getArtistId(artist) ? ['/artist', getArtistId(artist)] : null"
         (click)="!getArtistId(artist) && $event.preventDefault()"
         class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden cursor-pointer">
        <div class="p-6 flex gap-4 items-center">
          <img [src]="getImageUrl(artist.profileImageUrl)"
               [alt]="artist.name"
               class="h-16 w-16 rounded-full object-cover bg-gray-200">
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-900">{{ artist.name }}</h3>
            <p class="text-sm text-gray-600 line-clamp-2">{{ artist.bio }}</p>
            <p class="text-xs text-gray-500 mt-2">{{ artist.contact?.email }}</p>
          </div>
        </div>
      </a>
    </div>

    <ng-container *ngIf="!loading && (artists?.length || 0) === 0">
      <div class="text-center py-12 bg-white rounded shadow">
        <p class="text-gray-600 text-lg">No artists found.</p>
      </div>
    </ng-container>
  </div>
</div>
