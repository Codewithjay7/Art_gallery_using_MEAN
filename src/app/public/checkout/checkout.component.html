<div class="min-h-screen bg-gray-50 py-12">
  <div class="container mx-auto px-6 max-w-xl">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Checkout</h1>

    <div class="bg-white rounded-lg shadow p-6">
      <div *ngIf="!success">
        <p class="text-gray-700 mb-4">
          You are about to simulate a payment for your artworks.
        </p>
        <div class="flex items-center justify-between mb-4">
          <span class="text-gray-600">Total amount</span>
          <span class="text-2xl font-bold text-gray-900">{{ total | currency:'USD' }}</span>
        </div>

        <button (click)="payNow()"
                [disabled]="processing || total === 0"
                class="w-full px-4 py-2 bg-purple-600 text-white rounded-md text-sm font-medium hover:bg-purple-700 disabled:opacity-50">
          <span *ngIf="!processing">Pay Now</span>
          <span *ngIf="processing">Processing...</span>
        </button>
      </div>

      <div *ngIf="success" class="text-center">
        <h2 class="text-2xl font-bold text-green-700 mb-2">Payment Successful</h2>
        <p class="text-gray-700 mb-4">
          Your artwork purchase is confirmed (simulated).
        </p>
        <button (click)="backToGallery()"
                class="px-4 py-2 bg-purple-600 text-white rounded-md text-sm font-medium hover:bg-purple-700">
          Back to Gallery
        </button>
      </div>
    </div>
  </div>
</div>
