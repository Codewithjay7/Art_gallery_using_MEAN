<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900">{{ isEditMode ? 'Edit Artist' : 'Add New Artist' }}</h1>
      <p class="text-gray-600 mt-1">{{ isEditMode ? 'Update artist information' : 'Add a new artist to the gallery' }}</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ error }}
    </div>

    <!-- Form -->
    <form [formGroup]="artistForm" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow p-6">
      <!-- Profile Image -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Profile Image</label>
        <div class="flex items-center gap-4">
          <div *ngIf="imagePreview" class="h-24 w-24 rounded-full overflow-hidden border-2 border-gray-300">
            <img [src]="imagePreview" alt="Preview" class="h-full w-full object-cover">
          </div>
          <input type="file" accept="image/*" (change)="onFileSelected($event)" 
                 class="block text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
        <p class="mt-1 text-sm text-gray-500">JPEG, PNG or WEBP (max 2MB)</p>
      </div>

      <!-- Name -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
        <input type="text" formControlName="name" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
               [class.border-red-500]="artistForm.get('name')?.invalid && artistForm.get('name')?.touched">
        <p *ngIf="artistForm.get('name')?.invalid && artistForm.get('name')?.touched" class="mt-1 text-sm text-red-600">
          Name is required
        </p>
      </div>

      <!-- Bio -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Bio *</label>
        <textarea formControlName="bio" rows="4"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                  [class.border-red-500]="artistForm.get('bio')?.invalid && artistForm.get('bio')?.touched"></textarea>
        <p *ngIf="artistForm.get('bio')?.invalid && artistForm.get('bio')?.touched" class="mt-1 text-sm text-red-600">
          Bio is required
        </p>
      </div>

      <!-- Contact Info -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
          <input type="email" formControlName="email"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                 [class.border-red-500]="artistForm.get('email')?.invalid && artistForm.get('email')?.touched">
          <p *ngIf="artistForm.get('email')?.invalid && artistForm.get('email')?.touched" class="mt-1 text-sm text-red-600">
            Valid email is required
          </p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Phone *</label>
          <input type="tel" formControlName="phone"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                 [class.border-red-500]="artistForm.get('phone')?.invalid && artistForm.get('phone')?.touched">
          <p *ngIf="artistForm.get('phone')?.invalid && artistForm.get('phone')?.touched" class="mt-1 text-sm text-red-600">
            Phone is required
          </p>
        </div>
      </div>

      <!-- Social Links -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Social Links (Optional)</label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-600 mb-1">Website</label>
            <input type="url" formControlName="website" placeholder="https://..."
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Instagram</label>
            <input type="text" formControlName="instagram" placeholder="@username"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Twitter</label>
            <input type="text" formControlName="twitter" placeholder="@username"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3">
        <button type="button" (click)="cancel()" 
                class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
          Cancel
        </button>
        <button type="submit" [disabled]="loading || artistForm.invalid"
                class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Artist' : 'Create Artist') }}
        </button>
      </div>
    </form>
  </div>
</div>
