<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-3xl mx-auto">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900">{{ isEditMode ? 'Edit Event' : 'Add New Event' }}</h1>
      <p class="text-gray-600 mt-1">{{ isEditMode ? 'Update event information' : 'Create a new gallery exhibition' }}</p>
    </div>

    <div *ngIf="error" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ error }}
    </div>
    <div *ngIf="success" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-800 rounded">
      {{ success }}
    </div>

    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow p-6">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Title *</label>
        <input type="text" formControlName="title"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
               [class.border-red-500]="eventForm.get('title')?.invalid && eventForm.get('title')?.touched">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea rows="4" formControlName="description"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Location *</label>
        <input type="text" formControlName="location"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
               [class.border-red-500]="eventForm.get('location')?.invalid && eventForm.get('location')?.touched">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Start date *</label>
          <input type="datetime-local" formControlName="startDate"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                 [class.border-red-500]="eventForm.get('startDate')?.invalid && eventForm.get('startDate')?.touched">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">End date *</label>
          <input type="datetime-local" formControlName="endDate"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                 [class.border-red-500]="eventForm.get('endDate')?.invalid && eventForm.get('endDate')?.touched">
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Participating Artists</label>
        <select multiple formControlName="participatingArtists"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[140px]">
          <option *ngFor="let artist of artists" [value]="artist._id || artist.id">{{ artist.name }}</option>
        </select>
        <p *ngIf="artists.length === 0" class="mt-1 text-sm text-yellow-600">
          No artists available. Create artists first.
        </p>
      </div>

      <div class="flex justify-end gap-3">
        <button type="button" (click)="cancel()"
                class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
          Cancel
        </button>
        <button type="submit" [disabled]="loading || eventForm.invalid"
                class="px-4 py-2 bg-indigo-600 text-white rounded-md text-sm font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Event' : 'Create Event') }}
        </button>
      </div>
    </form>
  </div>
</div>
